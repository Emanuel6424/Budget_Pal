spring:
  liquibase:
    enabled: true
    change-log: classpath:/db/migration/changelog-root.xml
    default-schema: ${PGSCHEMA:budgetpalproject}
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        default_schema: ${PGSCHEMA:budgetpalproject}